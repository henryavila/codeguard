name: few-arguments
description: Functions should have few parameters to remain understandable
category: clean-code
layer: core
severity: suggestion
classification: hygiene

detection:
  signals:
    - type: file
      value: "**/*.{php,ts,js,py,java,go,rb}"
  confidence: medium

verification:
  rules:
    - functions should have at most 7 parameters (SonarQube S107, Checkstyle ParameterNumber, Miller's Law 7±2); exceeding this is a finding
    - 4+ parameters is a signal to review — consider grouping related parameters into objects or DTOs when they travel together
    - constructor dependency injection parameters are acceptable and should not be flagged

examples:
  correct: |
    class ReportGenerator {
      public function generate(ReportConfig $config): Report {
        // config encapsulates startDate, endDate, format, filters
      }
    }
  violation: |
    class ReportGenerator {
      public function generate(
        string $startDate,
        string $endDate,
        string $format,
        array $filters,
        bool $includeCharts,
        string $outputPath
      ): Report {
        // too many parameters — group into a config object
      }
    }
