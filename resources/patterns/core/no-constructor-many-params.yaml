name: no-constructor-many-params
description: Constructors should not have too many parameters — signals a missing abstraction
category: clean-code
layer: core
severity: suggestion
classification: hygiene

detection:
  signals:
    - type: file
      value: "**/*.{php,ts,js,py,java,go,rb}"
  confidence: high

verification:
  rules:
    - constructors follow the same threshold as functions — max 7 parameters (SonarQube S107 applies equally to constructors); no tool distinguishes DI from non-DI
    - dependency injection parameters (services, repositories) are acceptable and should not be flagged — but a class needing more than 5-6 injected dependencies is a strong SRP smell
    - if a constructor accepts many data parameters, group them into a configuration or value object (Builder, DTO)

examples:
  correct: |
    class ShippingLabel {
      public function __construct(
        private Address $from,
        private Address $to,
        private PackageDimensions $dimensions
      ) {}
    }
  violation: |
    class ShippingLabel {
      public function __construct(
        private string $fromName,
        private string $fromStreet,
        private string $fromCity,
        private string $fromZip,
        private string $fromCountry,
        private string $toName,
        private string $toStreet,
        private string $toCity,
        private string $toZip,
        private string $toCountry,
        private float $weight,
        private float $width,
        private float $height,
        private float $depth
      ) {}
    }
