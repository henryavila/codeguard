name: service-layer
description: Controllers delegate business logic to Services
category: framework
layer: laravel
severity: critical
classification: mvp

detection:
  signals:
    - type: directory
      value: app/Services
    - type: import
      value: "App\\Services\\*"
  confidence: high

verification:
  rules:
    - controllers must not access Eloquent models directly
    - controllers must not contain business logic
    - services must not return HTTP responses
    - services must not access Request object

examples:
  correct: |
    public function store(StoreOrderRequest $request): JsonResponse
    {
        $result = $this->orderService->create(OrderData::from($request));
        return response()->json($result);
    }
  violation: |
    // Controller accessing Eloquent directly (bypasses service layer)
    public function store(Request $request): JsonResponse
    {
        $order = Order::create($request->all());
        return response()->json($order);
    }

    // Service returning an HTTP response (leaks HTTP concern into business layer)
    class OrderService
    {
        public function create(OrderData $data): JsonResponse
        {
            $order = Order::create($data->toArray());
            return response()->json($order, 201);
        }
    }

    // Service accessing the Request object (couples service to HTTP layer)
    class OrderService
    {
        public function create(Request $request): Order
        {
            return Order::create($request->validated());
        }
    }

related_patterns:
  - dto
  - form-requests
