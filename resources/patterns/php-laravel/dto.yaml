name: dto
description: Data transfer between layers should use typed DTOs (LaravelData or readonly classes)
category: framework
layer: laravel
severity: warning
classification: mvp

detection:
  signals:
    - type: directory
      value: app/DTOs
    - type: import
      value: "Spatie\\LaravelData\\Data"
  confidence: medium

verification:
  rules:
    - no raw arrays passed from controller to service (e.g., $service->create($request->all()))
    - no raw arrays returned from service methods to controllers
    - LaravelData objects (extending Spatie\LaravelData\Data) are valid DTOs
    - readonly classes with typed constructor properties are valid DTOs
    - Eloquent models returned from service to controller are acceptable

examples:
  correct: |
    // Using LaravelData DTO
    class OrderData extends Data
    {
        public function __construct(
            public readonly string $customer_id,
            public readonly array $items,
            public readonly ?string $coupon_code = null,
        ) {}
    }

    // Controller passes DTO to service
    public function store(StoreOrderRequest $request): JsonResponse
    {
        $order = $this->orderService->create(OrderData::from($request));
        return response()->json(OrderResource::make($order));
    }

    // Using a readonly class as DTO
    readonly class CreateUserData
    {
        public function __construct(
            public string $name,
            public string $email,
            public string $password,
        ) {}
    }
  violation: |
    // Passing raw array from request to service
    public function store(Request $request): JsonResponse
    {
        $order = $this->orderService->create($request->all());
        return response()->json($order);
    }

    // Returning raw array from service
    class OrderService
    {
        public function getSummary(int $orderId): array
        {
            $order = Order::find($orderId);
            return [
                'total' => $order->total,
                'status' => $order->status,
                'items_count' => $order->items->count(),
            ];
        }
    }

related_patterns:
  - service-layer
  - form-requests
