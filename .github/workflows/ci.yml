# CodeGuard package CI.
#
# Runs the package's own quality gates (defined in composer.json `ci` script)
# against PRs and pushes to main. Dogfooding: this is the same shape we ship
# to consumers via resources/stubs/.github/workflows/codeguard-ci.yml.stub —
# but here we run `composer ci` (pint:test + phpstan + test:coverage) instead
# of `composer codeguard:check`, because the package itself is a library and
# does not run codeguard:check on itself.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: ci (pint + phpstan + pest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-version }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run CI suite
        run: composer ci
